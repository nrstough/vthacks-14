[pytest]
testpaths = tests
pythonpath = .
# Registering a marker does NOT deselect it. The gate is documented as
# -m "not perf", which would happily collect and run the live Nessie tests
# and put the suite on the network. addopts makes the default run exclude
# both, so every documented command stays correct as written.
addopts = -m "not perf and not nessie"
markers =
    perf: timing measurements, reported not gating
    nessie: hits the live Nessie sandbox; opt in with -m nessie
